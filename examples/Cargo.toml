[package]
name = "examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = ["normalize"]
normalize = ["dep:syntaqs-normalize"]
export = ["dep:syntaqs-export", "dep:blas-provider"]
libm = ["normalize"]

[dependencies]
syntaqs-core.workspace = true
syntaqs-basic.workspace = true
syntaqs-geometry.workspace = true
syntaqs-normalize = { workspace = true, optional = true }
syntaqs-export = { workspace = true, optional = true, features = ["ndarray", "sprs"] }
syntaqs-spin-half.workspace = true
syntaqs-spin-one.workspace = true
syntaqs-fermion.workspace = true
blas-provider = { path = "../support/blas-provider", optional = true }

num-complex.workspace = true

[dev-dependencies]
num-traits.workspace = true
